name: VPN app

on:
  push:
    branches: [claude/adoring-allen-x0h3bi, claude/great-hypatia-fjs6s2, main]
    paths: ["vpn/**", ".github/workflows/vpn.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpn-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vpn

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Check server script
        run: |
          bash -n vpn.sh
          brew install shellcheck >/dev/null 2>&1 && shellcheck vpn.sh || echo "shellcheck unavailable, skipped"

      - name: Build app and disk image
        run: ./scripts/build-app.sh --dmg

      - name: Smoke test (launch the app)
        run: |
          test -f dist/VPN.app/Contents/Resources/vpn.sh
          ./dist/VPN.app/Contents/MacOS/VPN &
          PID=$!
          sleep 10
          if kill -0 $PID 2>/dev/null; then echo "App is running"; kill $PID; else echo "App exited early"; wait $PID; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: VPN-dmg
          path: vpn/dist/*.dmg

      - name: Publish GitHub release
        run: |
          VERSION="$(cat VERSION)"
          TAG="vpn-v$VERSION"
          DMG="dist/VPN-$VERSION.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
            gh release upload "$TAG" "$DMG" vpn.sh --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$DMG" vpn.sh --target "$GITHUB_SHA" --title "VPN $VERSION" \
              --notes-file release-notes.md --latest=false
          fi
